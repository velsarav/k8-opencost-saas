---
apiVersion: v1
kind: Namespace
metadata:
  name: customer-chat
  labels:
    app.kubernetes.io/part-of: opencost-ai-demo
    team: conversational-ai
    opencost.io/team: conversational-ai
---
apiVersion: v1
kind: Namespace
metadata:
  name: document-ai
  labels:
    app.kubernetes.io/part-of: opencost-ai-demo
    team: document-intelligence
    opencost.io/team: document-intelligence
---
apiVersion: v1
kind: Namespace
metadata:
  name: vision-ai
  labels:
    app.kubernetes.io/part-of: opencost-ai-demo
    team: computer-vision
    opencost.io/team: computer-vision
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-chat-config
  namespace: customer-chat
  labels:
    app.kubernetes.io/name: customer-chat
    app.kubernetes.io/part-of: opencost-ai-demo
    team: conversational-ai
data:
  workload: customer-chat
  owner: conversational-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-chat
  namespace: customer-chat
  labels:
    app.kubernetes.io/name: customer-chat
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: opencost-ai-demo
    team: conversational-ai
    opencost.io/team: conversational-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-chat
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: opencost-ai-demo
        team: conversational-ai
        opencost.io/team: conversational-ai
    spec:
      containers:
        - name: api
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: customer-chat-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: customer-chat
  namespace: customer-chat
  labels:
    app.kubernetes.io/name: customer-chat
    app.kubernetes.io/part-of: opencost-ai-demo
    team: conversational-ai
spec:
  selector:
    app.kubernetes.io/name: customer-chat
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-chat
  namespace: customer-chat
  labels:
    app.kubernetes.io/name: customer-chat
    app.kubernetes.io/part-of: opencost-ai-demo
    team: conversational-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-chat
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: customer-chat
  namespace: customer-chat
  labels:
    app.kubernetes.io/name: customer-chat
    app.kubernetes.io/part-of: opencost-ai-demo
    team: conversational-ai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-chat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: document-ai-config
  namespace: document-ai
  labels:
    app.kubernetes.io/name: document-ai
    app.kubernetes.io/part-of: opencost-ai-demo
    team: document-intelligence
data:
  workload: document-ai
  owner: document-intelligence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-ai
  namespace: document-ai
  labels:
    app.kubernetes.io/name: document-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: opencost-ai-demo
    team: document-intelligence
    opencost.io/team: document-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: document-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-ai
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: opencost-ai-demo
        team: document-intelligence
        opencost.io/team: document-intelligence
    spec:
      containers:
        - name: document-processor
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: document-ai-config
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: document-ai
  namespace: document-ai
  labels:
    app.kubernetes.io/name: document-ai
    app.kubernetes.io/part-of: opencost-ai-demo
    team: document-intelligence
spec:
  selector:
    app.kubernetes.io/name: document-ai
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: document-ai
  namespace: document-ai
  labels:
    app.kubernetes.io/name: document-ai
    app.kubernetes.io/part-of: opencost-ai-demo
    team: document-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: document-ai
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: document-ai
  namespace: document-ai
  labels:
    app.kubernetes.io/name: document-ai
    app.kubernetes.io/part-of: opencost-ai-demo
    team: document-intelligence
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vision-ai-config
  namespace: vision-ai
  labels:
    app.kubernetes.io/name: vision-ai
    app.kubernetes.io/part-of: opencost-ai-demo
    team: computer-vision
data:
  workload: vision-ai
  owner: computer-vision
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-ai
  namespace: vision-ai
  labels:
    app.kubernetes.io/name: vision-ai
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: opencost-ai-demo
    team: computer-vision
    opencost.io/team: computer-vision
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vision-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vision-ai
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: opencost-ai-demo
        team: computer-vision
        opencost.io/team: computer-vision
    spec:
      containers:
        - name: inference-api
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vision-ai-config
          resources:
            requests:
              cpu: 1500m
              memory: 3Gi
            limits:
              cpu: "3"
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: vision-ai
  namespace: vision-ai
  labels:
    app.kubernetes.io/name: vision-ai
    app.kubernetes.io/part-of: opencost-ai-demo
    team: computer-vision
spec:
  selector:
    app.kubernetes.io/name: vision-ai
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vision-ai
  namespace: vision-ai
  labels:
    app.kubernetes.io/name: vision-ai
    app.kubernetes.io/part-of: opencost-ai-demo
    team: computer-vision
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vision-ai
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vision-ai
  namespace: vision-ai
  labels:
    app.kubernetes.io/name: vision-ai
    app.kubernetes.io/part-of: opencost-ai-demo
    team: computer-vision
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vision-ai
